[package]
name = "beside-pet-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] } # SSE 의 이벤트 스트림(Stream, StreamExt)
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] } # 모델 공급자(Anthropic, Ollama) 호출. TLS 는 sqlx 와 같은 rustls+ring+webpki 루트
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] } # 모르는 칸의 오류를 본문에 온 순서대로 낸다(class-validator 와 같게)
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "chrono", "json"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
